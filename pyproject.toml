[tool.poetry]
name = "sr_dev_test"
version = "0.1.0"
description = "Sr. FactoryOS Developer tests"
authors = ["Alex Rodriguez <alex.rodriguez@factoryos.dev>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.1.3"
numpy = "^1.26.2"
scikit-learn = "^1.3.2"
strawberry-graphql = "^0.130.0"
fastapi = "^0.108.0"
uvicorn = "^0.25.0"
scipy = "^1.11.4"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.0.2"
pytest = "^7.4.3"
autopep8 = "^2.0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
